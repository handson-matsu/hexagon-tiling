<!doctype html><html lang="ja"><meta charset="utf-8"><title>アクセス記録ブラウザテスト</title>
<style>body{font:15px sans-serif;padding:20px;color:#263c46}li{margin:8px}.fail{color:#b42318}iframe{width:1200px;height:780px;border:1px solid #ddd}</style>
<h1>GASアクセス記録のブラウザテスト</h1><p>実アプリを読み込み、通信だけを成功・非同期失敗・同期失敗に置換します。GASへのテスト記録は送信しません。</p><p id="summary">実行中</p><ol id="results"></ol><iframe id="app" title="テスト対象アプリ"></iframe>
<script type="module">
import {ACCESS_CONFIG} from '../src/access-counter.js';
let passed=0,failed=0;const results=document.querySelector('#results'),frame=document.querySelector('#app');
const assert=(v,message)=>{if(!v)throw Error(message);};
async function test(name,run){const li=document.createElement('li');try{await run();passed++;li.textContent='PASS '+name;}catch(error){failed++;li.className='fail';li.textContent='FAIL '+name+': '+error.message;}results.append(li);}
const attempts=[],downloads=[],errors=[];let mode='success';
window.captureAccess=(id,args)=>{attempts.push({id,args});if(mode==='throw')throw Error('synchronous network failure');if(mode==='reject')return Promise.reject(Error('offline'));return Promise.resolve({type:'opaque'});};
window.captureDownload=(id,href,name)=>downloads.push({id,href,name});
window.captureError=message=>errors.push(message);
const original=await (await fetch('../index.html',{cache:'no-store'})).text();
const injected=`<base href="../"><script>
const documentId=crypto.randomUUID();
window.fetch=(...args)=>parent.captureAccess(documentId,args);
HTMLAnchorElement.prototype.click=function(){parent.captureDownload(documentId,this.href,this.download);};
window.addEventListener('error',event=>parent.captureError(event.message));
window.addEventListener('unhandledrejection',event=>parent.captureError(String(event.reason)));
<\/script>`;
const html=original.replace('<head>','<head>'+injected);
const loaded=()=>new Promise(resolve=>frame.addEventListener('load',resolve,{once:true}));
const waitFor=async condition=>{const limit=Date.now()+15000;while(!condition()){if(Date.now()>limit)throw Error('timeout');await new Promise(resolve=>setTimeout(resolve,20));}};
let d;const $=s=>d.querySelector(s),click=s=>{const node=$(s);if(node.click)node.click();else node.dispatchEvent(new frame.contentWindow.MouseEvent('click',{bubbles:true}));};
const change=(s,value)=>{$(s).value=value;$(s).dispatchEvent(new Event('change'));};
for(const scenario of ['success','reject','throw']){
 mode=scenario;const before=attempts.length,errorBefore=errors.length,downloadBefore=downloads.length;let id;
 await test(`${scenario}: 初回表示はGETを1回（app=hexagon-tiling）`,async()=>{
 const ready=loaded();frame.srcdoc=html;await ready;d=frame.contentDocument;
 assert($('#board svg'),'board unavailable');assert(attempts.length===before+1,'wrong initial count');
 const call=attempts.at(-1);id=call.id;const [url,options]=call.args;
 const expected=new URL(ACCESS_CONFIG.endpoint);expected.searchParams.set('app','hexagon-tiling');assert(url===expected.href,'endpoint/app differ');
 assert(options.method==='GET'&&options.mode==='no-cors'&&options.cache==='no-store','request options');
 });
 await test(`${scenario}: 回転・反転・ピース数・配置・マーク・色・リセットで追加送信なし`,()=>{
 click('[data-tile="0"]');click('[data-tile="0"]');assert($('[data-tile="0"]').getAttribute('transform').includes('rotate(60)'),'rotation');
 click('#flip');assert($('[data-tile="0"] [data-hand]').getAttribute('fill')==='#B7D9E8','flip');click('#one-reset');
 for(let i=0;i<3;i++){click('#half-'+i);assert($('#backs').children.length===8+2*i,'split');}
 change('#matching',7);assert($('#matching-description').textContent.includes('タイプ5'),'type');
 change('#pair-mark-0','star');assert($('#pair-mark-0').value==='star','mark');
 $('#pairs .swatches').children[2].click();assert($('#pairs .swatches').children[2].getAttribute('aria-pressed')==='true','color');
 click('#piece-back-0');assert($('#preview [data-piece-background="0"]').getAttribute('fill')==='#DCE2E6','piece face');
 click('#all-reset');click('#settings-reset');assert($('#board svg'),'reset');
 assert(attempts.length===before+1,'extra request during operation');
 });
 await test(`${scenario}: 実際の保存ボタンでタイル・全体PNGを生成、追加送信なし`,async()=>{
 click('#save-tile');await waitFor(()=>downloads.length===downloadBefore+1);
 click('#save-board');await waitFor(()=>downloads.length===downloadBefore+2);
 for(const item of downloads.slice(downloadBefore)){
 assert(item.id===id&&item.name.endsWith('.png')&&item.href.startsWith('blob:'),'download');
 const blob=await (await fetch(item.href)).blob();const bytes=new Uint8Array(await blob.slice(0,8).arrayBuffer());
 assert(blob.type==='image/png'&&blob.size>1000&&bytes[0]===137&&bytes[1]===80,'invalid PNG');
 }
 assert(attempts.length===before+1,'extra PNG request');
 });
 await test(`${scenario}: iframeを実際に再読み込みすると新しい文書から1回だけ送信`,async()=>{
 const ready=loaded();frame.contentWindow.location.reload();await ready;d=frame.contentDocument;
 assert(attempts.length===before+2,'reload count');assert(attempts.at(-1).id!==id,'document did not reload');
 click('[data-tile="0"]');click('[data-tile="0"]');assert(attempts.length===before+2,'post-reload interaction count');
 });
 await test(`${scenario}: 通信失敗も未処理エラーにならずアプリを操作可能`,async()=>{
 await new Promise(resolve=>setTimeout(resolve,0));assert(errors.length===errorBefore,errors.slice(errorBefore).join(';'));
 assert($('#preview svg')&&$('#board svg')&&!$('#save-tile').disabled,'app unusable');
 });
}
document.querySelector('#summary').textContent=`${passed}件成功 / ${failed}件失敗`;
</script></html>
